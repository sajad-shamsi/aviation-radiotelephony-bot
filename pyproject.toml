[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-radiotelephony-bot"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "aiosqlite>=0.21,<1",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
